<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Marshal: independent documents, shared workspace</title><desc id="desc">A saved job and permitted background feed independent cover letter and résumé editors. Human review precedes guarded export. Assessment is optional; saves detect revision conflicts.</desc>
<rect width="960" height="540" rx="20" fill="#101923"/>
<g font-family="Arial, sans-serif">
<text x="48" y="58" fill="#67e8f9" font-size="17" letter-spacing="3">MARSHAL / WORKFLOW</text>
<text x="48" y="112" fill="#f5f5f5" font-size="34" font-weight="700">Fewer gates. More control.</text>
<text x="48" y="147" fill="#a3b4c6" font-size="20">One workspace across laptop and phone</text>
