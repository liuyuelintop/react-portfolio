<title id="title">MoneyGuard: from weekly inputs to planning decisions</title><desc id="desc">Reviewed hours, pay and expenses feed deterministic calculations for weekly surplus, purchase cost in paid hours, and cash before expected or delayed payday. History is browser-local; optional AI explains selected inputs.</desc>
